<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي المتطور</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --sidebar-bg: #161b22;
            --chat-bg: #0d1117;
            --input-bg: #21262d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --user-msg-bg: #1f6feb;
            --bot-msg-bg: #21262d;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--sidebar-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h2 {
            font-size: 1.1rem;
            color: #f0f6fc;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            line-height: 1.6;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
            padding: 12px 16px;
            word-break: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-start;
            background-color: var(--user-msg-bg);
            color: #ffffff;
            border-radius: 15px 15px 2px 15px;
        }

        .message.bot {
            align-self: flex-end;
            background-color: var(--bot-msg-bg);
            color: var(--text-color);
            border-radius: 15px 15px 15px 2px;
            border: 1px solid var(--border-color);
            white-space: pre-wrap;
        }

        .message img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            margin-bottom: 8px;
            object-fit: contain;
        }

        .chat-input-container {
            padding: 12px 15px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #imagePreviewContainer {
            display: none;
            align-items: center;
            gap: 10px;
            background: var(--sidebar-bg);
            padding: 8px 12px;
            border-radius: 8px;
            width: fit-content;
            border: 1px solid var(--border-color);
        }

        #imagePreviewContainer img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }

        .remove-img-btn {
            background: #da3633;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .input-box {
            display: flex;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px 12px;
            align-items: center;
            gap: 10px;
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.95rem;
            resize: none;
            height: 40px;
            max-height: 120px;
            padding: 8px 0;
            line-height: 1.4;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .action-btn:hover {
            color: var(--accent-color);
        }

        .send-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        .send-btn:disabled {
            background-color: #484f58;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: inline-block;
            font-style: italic;
            color: #8b949e;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="main-chat">
            <div class="chat-header">
                <h2>🤖 مساعد الذكاء الاصطناعي (النصوص والصور)</h2>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    أهلاً بك! يمكنك طرح أي سؤال، أو إرفاق صورة لتحليلها وشرحها بالتفصيل.
                </div>
            </div>

            <div class="chat-input-container">
                <div id="imagePreviewContainer">
                    <img id="previewImg" src="" alt="معاينة">
                    <span id="imageName" style="font-size: 0.85rem; color: #fff;"></span>
                    <button class="remove-img-btn" onclick="clearImage()">حذف</button>
                </div>

                <div class="input-box">
                    <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
                    <button class="action-btn" title="إرفاق صورة" onclick="document.getElementById('imageInput').click()">📷</button>
                    
                    <textarea id="userInput" placeholder="اكتب سؤالك أو ارفق صورة..." onkeydown="handleKeyPress(event)"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">إرسال</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "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";

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const imageInput = document.getElementById('imageInput');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const previewImg = document.getElementById('previewImg');
        const imageName = document.getElementById('imageName');

        let currentImageBase64 = null;

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageBase64 = e.target.result;
                    previewImg.src = currentImageBase64;
                    imageName.innerText = file.name.length > 15 ? file.name.substring(0, 15) + '...' : file.name;
                    imagePreviewContainer.style.display = 'flex';
                }
                reader.readAsDataURL(file);
            }
        }

        function clearImage() {
            currentImageBase64 = null;
            imageInput.value = '';
            imagePreviewContainer.style.display = 'none';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text && !currentImageBase64) return;

            addUserMessageToUI(text, currentImageBase64);

            const textToSend = text;
            const imageToSend = currentImageBase64;

            userInput.value = '';
            clearImage();
            sendBtn.disabled = true;

            const loadingId = addLoadingIndicator();

            try {
                let messageContent = [];
                
                if (textToSend) {
                    messageContent.push({ "type": "text", "text": textToSend });
                } else if (imageToSend) {
                    messageContent.push({ "type": "text", "text": "قم بتحليل هذه الصورة وشرح ما فيها بالتفصيل." });
                }

                if (imageToSend) {
                    messageContent.push({
                        "type": "image_url",
                        "image_url": { "url": imageToSend }
                    });
                }

                // نموذج قوي وداعم للصور والنصوص بكفاءة عالية
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "HTTP-Referer": window.location.href,
                        "X-Title": "AI Chat Bot",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "openai/gpt-4o-mini",
                        "messages": [
                            {
                                "role": "user",
                                "content": messageContent
                            }
                        ]
                    })
                });

                const data = await response.json();
                removeLoadingIndicator(loadingId);

                if (data.choices && data.choices.length > 0) {
                    const botReply = data.choices[0].message.content;
                    addMessage(botReply, 'bot');
                } else if (data.error) {
                    addMessage("خطأ: " + (data.error.message || "حدث خطأ بالاتصال بالنموذج."), 'bot');
                } else {
                    addMessage("عذراً، لم يتلق السيرفر إجابة صحيحة.", 'bot');
                }

            } catch (error) {
                removeLoadingIndicator(loadingId);
                addMessage("تعذر الاتصال بالسيرفر. تأكد من اتصال الإنترنت.", 'bot');
                console.error(error);
            } finally {
                sendBtn.disabled = false;
            }
        }

        function addUserMessageToUI(text, imgSrc) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user';
            
            let contentHTML = '';
            if (imgSrc) {
                contentHTML += `<img src="${imgSrc}" alt="صورة مرفقة">`;
            }
            if (text) {
                contentHTML += `<span>${text}</span>`;
            }
            
            msgDiv.innerHTML = contentHTML;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + sender;
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addLoadingIndicator() {
            const id = 'loading-' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message bot';
            msgDiv.id = id;
            msgDiv.innerHTML = '<span class="typing-indicator">جاري التحليل والإجابة...</span>';
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }

        function removeLoadingIndicator(id) {
            const elem = document.getElementById(id);
            if (elem) elem.remove();
        }
    </script>
</body>
</html>
