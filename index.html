<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مساعد الذكاء الاصطناعي</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --sidebar-bg: #161b22;
            --input-bg: #21262d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --user-msg-bg: #1f6feb;
            --bot-msg-bg: #21262d;
            --border-color: #30363d;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        }
        
        html, body {
            height: 100%;
            width: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .app-container { 
            display: flex; 
            width: 100%; 
            height: 100dvh; /* يتكيف تماماً مع ارتفاع شاشة الهاتف الديناميكي */
            flex-direction: column; 
        }

        .chat-header { 
            padding: 12px 15px; 
            background: var(--sidebar-bg); 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-shrink: 0;
        }

        .chat-header h2 { font-size: 0.95rem; color: #f0f6fc; }
        .key-btn { background: #238636; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }

        .chat-messages { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .message { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; }
        .message.user { align-self: flex-start; background: var(--user-msg-bg); color: #fff; }
        .message.bot { align-self: flex-end; background: var(--bot-msg-bg); border: 1px solid var(--border-color); white-space: pre-wrap; }
        .message img { max-width: 100%; max-height: 200px; border-radius: 8px; margin-bottom: 8px; display: block; }

        .chat-input-container { 
            padding: 10px 10px calc(15px + env(safe-area-inset-bottom)) 10px; /* مساحة أمان مخصصة لأسفل شاشات Redmi */
            background: var(--sidebar-bg); 
            border-top: 1px solid var(--border-color); 
            flex-shrink: 0;
        }

        #imagePreviewContainer { display: none; align-items: center; gap: 10px; margin-bottom: 8px; background: var(--input-bg); padding: 6px 10px; border-radius: 6px; width: fit-content; border: 1px solid var(--border-color); }
        #imagePreviewContainer img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }

        .input-box { display: flex; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 6px 10px; align-items: center; gap: 8px; }
        .input-box textarea { flex: 1; background: transparent; border: none; outline: none; color: #fff; height: 38px; resize: none; padding: 6px 0; font-size: 0.95rem; }
        .send-btn { background: var(--accent-color); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; flex-shrink: 0; }
        .send-btn:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="chat-header">
            <h2>🤖 مساعد الذكاء الاصطناعي</h2>
            <button class="key-btn" onclick="promptApiKey()">🔑 إدخال المفتاح</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">أهلاً بك يا غدير! اضغط على زر "🔑 إدخال المفتاح" في الأعلى وضع مفتاحك الخاص، ثم ابدأ بالدردشة أو إرسال الصور.</div>
        </div>

        <div class="chat-input-container">
            <div id="imagePreviewContainer">
                <img id="previewImg" src="">
                <button style="background:#da3633; color:#fff; border:none; padding:2px 6px; border-radius:4px; cursor:pointer;" onclick="clearImage()">حذف</button>
            </div>
            <div class="input-box">
                <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleImage(event)">
                <button style="background:transparent; border:none; font-size:1.2rem; cursor:pointer;" onclick="document.getElementById('imageInput').click()" title="إرفاق صورة">📷</button>
                <textarea id="userInput" placeholder="اكتب سؤالك هنا..." onkeydown="handleKeyPress(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('openrouter_key') || '';

        function promptApiKey() {
            const key = prompt("أدخل مفتاح OpenRouter API الخاص بك (sk-or-v1-...):", apiKey);
            if (key !== null) {
                apiKey = key.trim();
                localStorage.setItem('openrouter_key', apiKey);
                if (apiKey) {
                    alert("تم حفظ المفتاح بنجاح على هاتفك!");
                }
            }
        }

        let currentImg = null;
        function handleImage(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    currentImg = evt.target.result;
                    document.getElementById('previewImg').src = currentImg;
                    document.getElementById('imagePreviewContainer').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function clearImage() {
            currentImg = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreviewContainer').style.display = 'none';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            if (!apiKey) {
                alert("يرجى إدخال مفتاح API أولاً بالضغط على زر '🔑 إدخال المفتاح' في الأعلى.");
                promptApiKey();
                return;
            }

            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text && !currentImg) return;

            const chat = document.getElementById('chatMessages');
            
            let userHTML = `<div class="message user">`;
            if(currentImg) userHTML += `<img src="${currentImg}" alt="صورة">`;
            if(text) userHTML += `<span>${text}</span>`;
            userHTML += `</div>`;
            chat.innerHTML += userHTML;

            const sendText = text || "قم بتحليل هذه الصورة وشرحها بالتفصيل.";
            const sendImg = currentImg;
            input.value = '';
            clearImage();

            const loadId = 'load-' + Date.now();
            chat.innerHTML += `<div class="message bot" id="${loadId}">جاري التفكير...</div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                let content = [{ type: "text", text: sendText }];
                if(sendImg) {
                    content.push({ type: "image_url", image_url: { url: sendImg } });
                }

                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "HTTP-Referer": window.location.href,
                        "X-Title": "AI Chat Bot",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "google/gemini-flash-1.5:free",
                        "messages": [{ "role": "user", "content": content }]
                    })
                });

                const data = await res.json();
                document.getElementById(loadId)?.remove();

                if(data.choices && data.choices.length > 0) {
                    const reply = data.choices[0].message.content;
                    chat.innerHTML += `<div class="message bot">${reply}</div>`;
                } else if(data.error) {
                    chat.innerHTML += `<div class="message bot">خطأ: ${data.error.message || JSON.stringify(data.error)}</div>`;
                } else {
                    chat.innerHTML += `<div class="message bot">عذراً، لم يتم استلام رد صحيح من السيرفر.</div>`;
                }
            } catch(e) {
                document.getElementById(loadId)?.remove();
                chat.innerHTML += `<div class="message bot">حدث خطأ في الاتصال بالشبكة. تأكد من إعدادات الـ VPN ومفتاحك.</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
